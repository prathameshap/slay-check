# Slay Check — run every configured AI provider in parallel.
# Each job posts its own PR comment so you can compare reviews side-by-side.
#
# Required secrets (add only the ones you want to use):
#   OPENAI_API_KEY, ANTHROPIC_API_KEY, GOOGLE_AI_API_KEY, PERPLEXITY_API_KEY
# GITHUB_TOKEN is automatic.
#
# Jobs whose secret is missing are skipped automatically.
# Note: secrets must be accessed via environment variables in steps, not in
# job-level `if:` guards (the secrets context is unavailable there).

name: "Slay Check — All Models"

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: slay-check-all-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # ── OpenAI (GPT-4o) ──────────────────────────────────────────────
  openai:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Slay Check
        run: pip install git+https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/prathameshap/slay-check.git

      - name: Review (OpenAI)
        if: env.SLAY_CHECK_AI_TOKEN != ''
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
          SLAY_CHECK_AI_PROVIDER: openai
          SLAY_CHECK_AI_MODEL: gpt-4o
          SLAY_CHECK_AI_TOKEN: ${{ secrets.OPENAI_API_KEY }}
          SLAY_CHECK_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m slay_check.github_action

      - name: Comment on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '**Slay Check (OpenAI) Review Failed**\n\nSee [workflow logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}).'
            })

  # ── Anthropic (Claude) ────────────────────────────────────────────
  anthropic:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false

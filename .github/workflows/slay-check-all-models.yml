# Slay Check — run every configured AI provider and post one combined comment.
#
# Required secrets — store in a GitHub Environment named "production"
# (Settings > Environments > production > Environment secrets):
#   OPENAI_API_KEY, ANTHROPIC_API_KEY, GOOGLE_AI_API_KEY, PERPLEXITY_API_KEY
# GITHUB_TOKEN is automatic and does not need to be added.
#
# Providers whose secret is missing are skipped automatically.

name: "Slay Check — All Models"

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: slay-check-all-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    environment: production
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Slay Check
        run: pip install git+https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/prathameshap/slay-check.git

      # ── OpenAI ────────────────────────────────────────────────────
      - name: Review (OpenAI)
        if: env.SLAY_CHECK_AI_TOKEN != ''
        continue-on-error: true
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
          SLAY_CHECK_AI_PROVIDER: openai
          SLAY_CHECK_AI_MODEL: gpt-4o
          SLAY_CHECK_AI_TOKEN: ${{ secrets.OPENAI_API_KEY }}
          SLAY_CHECK_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLAY_CHECK_OUTPUT_FILE: /tmp/review-openai.md
        run: python -m slay_check.github_action

      # ── Anthropic ─────────────────────────────────────────────────
      - name: Review (Anthropic)
        if: env.SLAY_CHECK_AI_TOKEN != ''
        continue-on-error: true
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
          SLAY_CHECK_AI_PROVIDER: anthropic
          SLAY_CHECK_AI_MODEL: claude-3-sonnet-20240229
          SLAY_CHECK_AI_TOKEN: ${{ secrets.ANTHROPIC_API_KEY }}
          SLAY_CHECK_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLAY_CHECK_OUTPUT_FILE: /tmp/review-anthropic.md
        run: python -m slay_check.github_action

      # ── Google AI ─────────────────────────────────────────────────
      - name: Review (Google AI)
        if: env.SLAY_CHECK_AI_TOKEN != ''
        continue-on-error: true
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
          SLAY_CHECK_AI_PROVIDER: google
          SLAY_CHECK_AI_MODEL: gemini-2.0-flash
          SLAY_CHECK_AI_TOKEN: ${{ secrets.GOOGLE_AI_API_KEY }}
          SLAY_CHECK_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLAY_CHECK_OUTPUT_FILE: /tmp/review-google.md
        run: python -m slay_check.github_action

      # ── Perplexity ────────────────────────────────────────────────
      - name: Review (Perplexity)
        if: env.SLAY_CHECK_AI_TOKEN != ''
        continue-on-error: true
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
          SLAY_CHECK_AI_PROVIDER: perplexity
          SLAY_CHECK_AI_MODEL: sonar-pro
          SLAY_CHECK_AI_TOKEN: ${{ secrets.PERPLEXITY_API_KEY }}
          SLAY_CHECK_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLAY_CHECK_OUTPUT_FILE: /tmp/review-perplexity.md
        run: python -m slay_check.github_action

      # ── GitHub Models ─────────────────────────────────────────────
      - name: Review (GitHub Models)
        continue-on-error: true
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
          SLAY_CHECK_AI_PROVIDER: github
          SLAY_CHECK_AI_MODEL: gpt-4o
          SLAY_CHECK_AI_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLAY_CHECK_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLAY_CHECK_OUTPUT_FILE: /tmp/review-github-models.md
        run: python -m slay_check.github_action

      # ── Combine & post ────────────────────────────────────────────
      - name: Post combined review
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const files = [
              '/tmp/review-openai.md',
              '/tmp/review-anthropic.md',
              '/tmp/review-google.md',
              '/tmp/review-perplexity.md',
              '/tmp/review-github-models.md'
            ];

            const sections = [];
            for (const f of files) {
              if (fs.existsSync(f)) {
                sections.push(fs.readFileSync(f, 'utf8').trim());
              }
            }

            if (sections.length === 0) {
              core.info('No reviews were produced — skipping comment.');
              return;
            }

            const body = sections.join('\n\n---\n\n');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

# CI: Lint and test on push/PR (no AI tokens required)
name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run black
        run: |
          black slay_check tests
          if ! git diff --exit-code; then
            echo "::error::Code was reformatted by black. Run 'black slay_check tests' locally, commit, and push."
            exit 1
          fi

      - name: Run isort
        run: |
          isort slay_check tests
          if ! git diff --exit-code; then
            echo "::error::Imports were reordered by isort. Run 'isort slay_check tests' locally, commit, and push."
            exit 1
          fi

      - name: Run flake8
        run: flake8 slay_check tests
        continue-on-error: true

      - name: Run tests
        env:
          SLAY_CHECK_AI_TOKEN: "dummy"
          SLAY_CHECK_GITHUB_TOKEN: "dummy"
        run: pytest tests/ -v --no-cov -x

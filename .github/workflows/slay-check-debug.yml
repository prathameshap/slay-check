name: Slay Check - Debug Mode
on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  slay-check-debug:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Debug Environment
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "PR Number: ${{ github.event.pull_request.number }}"
          echo "Event Name: ${{ github.event_name }}"
          echo "AI Token Set: ${{ secrets.SLAY_CHECK_AI_TOKEN != '' }}"
          echo "GitHub Token Set: ${{ secrets.GITHUB_TOKEN != '' }}"
          
      - name: Install Slay Check
        run: |
          pip install git+https://github.com/prathameshap/slay-check.git
          
      - name: Test Slay Check Import
        run: |
          python -c "import slay_check; print('Slay Check imported successfully')"
          
      - name: Run Slay Check (Debug)
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          SLAY_CHECK_AI_PROVIDER: openai
          SLAY_CHECK_AI_MODEL: gpt-4o
          SLAY_CHECK_AI_BASE_URL: https://api.openai.com/v1/
          SLAY_CHECK_AI_TOKEN: ${{ secrets.SLAY_CHECK_AI_TOKEN }}
          SLAY_CHECK_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLAY_CHECK_VERBOSE: true
          SLAY_CHECK_DRY_RUN: true
        run: |
          python -m slay_check.github_action

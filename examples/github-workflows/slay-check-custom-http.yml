# Slay Check - Custom HTTP provider
# Copy to your repo: .github/workflows/slay-check-custom-http.yml
# Required var:    SLAY_CHECK_AI_BASE_URL  — your endpoint URL
# Optional secret: SLAY_CHECK_AI_TOKEN     — Bearer token (omit if not needed)
#
# Your endpoint must accept a POST with this JSON body:
#   { code, language, file_path, context, criteria, max_tokens, temperature }
# and return:
#   { analysis, score, issues, suggestions, complexity, confidence }

name: Slay Check - Custom HTTP Review
on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_target:
    types: [opened, synchronize, reopened]

jobs:
  slay-check-custom-http:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Slay Check
        run: |
          pip install git+https://github.com/prathameshap/slay-check.git

      - name: Run Slay Check (Custom HTTP)
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          SLAY_CHECK_AI_PROVIDER: custom_http
          SLAY_CHECK_AI_BASE_URL: ${{ vars.SLAY_CHECK_AI_BASE_URL }}
          SLAY_CHECK_AI_TOKEN: ${{ secrets.SLAY_CHECK_AI_TOKEN }}
          SLAY_CHECK_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLAY_CHECK_VERBOSE: ${{ vars.SLAY_CHECK_VERBOSE || 'false' }}
          SLAY_CHECK_DRY_RUN: ${{ vars.SLAY_CHECK_DRY_RUN || 'false' }}
        run: |
          python -m slay_check.github_action

      - name: Comment on PR (on failure)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '**Slay Check (Custom HTTP) Review Failed**\n\nPlease check the [workflow logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.'
            })

# Example: Run Slay Check from your own fork (e.g. to test changes before release).
# Copy to your repo: .github/workflows/slay-check.yml (or merge with existing).
# Set secret: SLAY_CHECK_AI_TOKEN, and replace YOUR_USERNAME below.
# If your fork is private, add `token: ${{ secrets.SLAY_CHECK_TOKEN }}` to the checkout step.

name: Slay Check - AI Code Review (Forked)
on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_target:
    types: [opened, synchronize, reopened]

jobs:
  slay-check:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false

    steps:
      - name: Checkout your repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Checkout Slay Check (forked)
        uses: actions/checkout@v5
        with:
          repository: YOUR_USERNAME/slay-check
          path: slay-check

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Slay Check from fork
        run: |
          cd slay-check
          pip install -e .

      - name: Run Slay Check
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          SLAY_CHECK_AI_PROVIDER: ${{ vars.SLAY_CHECK_AI_PROVIDER || 'openai' }}
          SLAY_CHECK_AI_TOKEN: ${{ secrets.SLAY_CHECK_AI_TOKEN }}
          SLAY_CHECK_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLAY_CHECK_VERBOSE: ${{ vars.SLAY_CHECK_VERBOSE || 'false' }}
          SLAY_CHECK_DRY_RUN: ${{ vars.SLAY_CHECK_DRY_RUN || 'false' }}
        run: |
          python -m slay_check.github_action

      - name: Comment on PR
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '**Slay Check Review Failed**\n\nPlease check the [workflow logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.\n\n**Using Slay Check fork:** YOUR_USERNAME/slay-check'
            })
